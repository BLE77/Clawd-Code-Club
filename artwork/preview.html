<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clawd - Claude Code Mascot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@5.0.3/index.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: "Cascadia Code", Consolas, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { color: #00d4aa; margin-bottom: 10px; }
    .subtitle { color: #606070; margin-bottom: 40px; }

    .terminal-container {
      background: #0a0a0f;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 20px;
      margin: 20px;
      position: relative;
      overflow: hidden;
    }

    .terminal-container h3 {
      color: #a0a0b0;
      font-size: 11px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    #terminal {
      width: 600px;
      height: 220px;
    }

    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
      max-width: 800px;
    }
    .control-group {
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 140px;
    }
    .control-group label {
      display: block;
      color: #606070;
      font-size: 10px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    select, input[type="color"] {
      background: #1a1a25;
      border: 1px solid #2a2a3a;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      width: 100%;
    }
    input[type="color"] {
      height: 32px;
      padding: 2px;
      cursor: pointer;
    }

    .trait-preview {
      margin-top: 30px;
      padding: 20px;
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      text-align: center;
      max-width: 600px;
    }
    .trait-preview h3 {
      color: #00d4aa;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .trait-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .trait-badge {
      background: #1a1a25;
      border: 1px solid #2a2a3a;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: #a0a0b0;
    }
    .trait-badge span {
      color: #00d4aa;
    }
  </style>
</head>
<body>
  <h1>Clawd</h1>
  <p class="subtitle">Claude Code Club - NFT Mascot Generator</p>

    <h3>Preview</h3>
    <div id="terminal"></div>
  </div>

    <div class="control-group">

        <option value="#f97316">Orange (Uncommon)</option>

        <option value="#22c55e">Green (Common)</option>
        <option value="#ffffff" selected>White (Common)</option>
        <option value="#f97316">Orange (Uncommon)</option>
        <option value="#3b82f6">Blue (Uncommon)</option>
        <option value="#ef4444">Red (Uncommon)</option>
        <option value="#b0b0c0">Silver (Uncommon)</option>

  </div>

  <div class="trait-preview">
    <h3>Current Traits</h3>

    </div>
    <div id="rarityDisplay" style="margin-top: 15px; padding: 10px 20px; border-radius: 20px; display: inline-block; font-weight: bold; font-size: 14px;"></div>

  <div class="artwork-showcase" style="margin-top: 40px; max-width: 1200px; width: 100%;">
    <h3 style="color: #00d4aa; font-size: 14px; text-align: center; margin-bottom: 20px;">IPFS Artwork Gallery</h3>
    <div class="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
      <div class="gallery-item" style="background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px; padding: 15px; text-align: center;">

      </div>
      <div class="gallery-item" style="background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px; padding: 15px; text-align: center;">
        <h4 style="color: #eab308; font-size: 11px; margin-bottom: 10px; text-transform: uppercase;">#0050 - Silver Crown</h4>
        <iframe src="https://nftstorage.link/ipfs/bafybeiamenrwy6dopfpqbvohsvkt74avqb4riig6tu3p4bh6gdcj7ohuty/0050.html" style="width: 100%; height: 260px; border: 1px solid #2a2a3a; border-radius: 4px; background: #0a0a0f;"></iframe>
      </div>
      <div class="gallery-item" style="background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px; padding: 15px; text-align: center;">
        <h4 style="color: #b0b0c0; font-size: 11px; margin-bottom: 10px; text-transform: uppercase;">#0100 - Random</h4>
        <iframe src="https://nftstorage.link/ipfs/bafybeiamenrwy6dopfpqbvohsvkt74avqb4riig6tu3p4bh6gdcj7ohuty/0100.html" style="width: 100%; height: 260px; border: 1px solid #2a2a3a; border-radius: 4px; background: #0a0a0f;"></iframe>
      </div>
      <div class="gallery-item" style="background: #12121a; border: 1px solid #2a2a3a; border-radius: 8px; padding: 15px; text-align: center;">
        <h4 style="color: #8b5cf6; font-size: 11px; margin-bottom: 10px; text-transform: uppercase;">#0200 - Random</h4>
        <iframe src="https://nftstorage.link/ipfs/bafybeiamenrwy6dopfpqbvohsvkt74avqb4riig6tu3p4bh6gdcj7ohuty/0200.html" style="width: 100%; height: 260px; border: 1px solid #2a2a3a; border-radius: 4px; background: #0a0a0f;"></iframe>

  <div class="trait-preview" style="margin-top: 20px;">
    <h3>Copy ASCII</h3>
    <textarea id="asciiOutput" readonly style="width: 100%; height: 120px; background: #0a0a0f; color: #b0b0c0; border: 1px solid #2a2a3a; border-radius: 4px; font-family: 'Cascadia Code', Consolas, monospace; font-size: 14px; padding: 10px; resize: none;"></textarea>
    <button id="copyBtn" style="margin-top: 10px; background: #00d4aa; color: #0a0a0f; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold;">Copy to Clipboard</button>
    <button id="randomizeBtn" style="margin-top: 10px; margin-left: 10px; background: #8b5cf6; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: bold;">🎲 Randomize All</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script>
    // ===========================================
    // CENTERED ASCII ART - Body always at same position
    // Canvas: 24 chars wide, body centered at position 5-12
    // ===========================================

    // ASCII art lines (centered)
    const baseAscii = [
      '     * ▐▛███▜▌ *',
      '    * ▝▜█████▛▘ *',
      '     *  ▘▘ ▝▝  *'
    ];

    // Hoodie variant (replaces base body)
    const hoodieAscii = [
      '      █▀▀▀▀▀▀▀▌',
      '    ▟██▐▛███▜▌▌ *',
      '      ▝▜█████▛▘ *',
      '     *  ▘▘ ▝▝  *'
    ];

    // Accessory ASCII art (below character)
    const accessoriesBelow = {};

    // Hand accessories (modify the body lines)
    const handAccessories = {
      coffee: '☕︎',
      peace: '✌︎',
      phone: '🖥',
      pen: '✎',
      rolex: '⏱',
      microphone: '🎙',
      adult: '( ๏ 人 ๏ )'  // 1/1 combo with 18+ stars
    };

    // Accessory ASCII art (above character) - ALL CENTERED
    // NOTE: Accessory colors are independent from body colors
    const accessoriesAbove = {
      tophat: [
        '        █▀▀▀█',
        '       ▀▀▀▀▀▀▀'
      ],
      crown: ['        ♛'],
      wizardhat: [
        '          ∧',
        '         /✦\\',
        '        /✦ ✦\\'
      ],
      cap: [
        '        ┌──╮',
        '        └──┘───'
      ],
      devil: [
        '        ▲   ▲'
      ],
      halo: [
        '          ○'
      ],
      antenna: [
        '          ⚆',
        '          │'
      ],
      headphones: [
        '       ╭─────╮',
        '       ◖     ◗'
      ],
      cowboy: [
        '       ╭─────╮',
        '      ═╧═════╧═'
      ],
      flowercrown: [
        '       ✿ ❀ ✿ ❀'
      ],
      beanie: [
        '       ╭─────╮',
        '       │▓▓▓▓▓│'
      ]
    };

    // Devil full ASCII (replaces entire body - all red!) - CENTERED
    const devilFullAscii = [
      '     ⛧   ▲   ▲ ⛧',
      '   ⛧    ▐▛███▜▌ Ψ⛧',
      '     ◄─▝▜█████▛▘⎦',
      '   ⛧     ▘▘ ▝▝ ⛧'
    ];

    // BLE77 1/1 ASCII (Mickey ears + 77 + AR glasses + skateboard) - CENTERED
    const ble77Ascii = [
      '        ⬤   ⬤',
      '    77 ▐▛███▜▌ 77',
      '   77 ▝▜█████▛▘ ⌐◨-◨',
      '    77  ▘▘ ▝▝  77',
      '        ●━━━━●'
    ];

    // Shoes ASCII - replaces the feet line (CENTERED)
    const shoesAscii = {
      none: '     *  ▘▘ ▝▝  *',      // Barefoot (default)
      slides: '     *  ═▘ ▝═  *',    // Slides
      crocs: '     *  ⊏▘ ▝⊐  *',     // Crocs
      heels: '     *  ▘▚ ▞▝  *',     // High Heels
      jordans: '     *  ▄█ █▄  *',   // Jordans 🔥
      dress: '     *  ◤◥ ◤◥  *'      // Dress Shoes
    };

    // Jordan tip colors (fire colors)
    const jordanTipColors = ['#ff4444', '#ff8800', '#ffcc00', '#ff0066', '#00ffcc'];

    // Random color palette for accessories and stars
    const randomColors = [
      '#ff6b6b',  // Red
      '#ffd93d',  // Yellow
      '#6bcb77',  // Green
      '#4d96ff',  // Blue
      '#c56cf0',  // Purple
      '#ff9ff3',  // Pink
      '#54a0ff',  // Light Blue
      '#ff9f43',  // Orange
      '#00d4aa',  // Teal/Diamond
      '#ffd700',  // Gold
      '#ffffff',  // White
    ];

    // ===========================================
    // FIXED CANVAS SYSTEM - Keep body in same position
    // ===========================================
    const CANVAS = {
      maxHatHeight: 3,      // Wizard hat is tallest (3 lines)
      bodyHeight: 3,        // Standard body is 3 lines
      maxShoesBelow: 1,     // Skateboard adds 1 line below
      totalHeight: 7,       // 3 hat + 3 body + 1 shoes
      width: 28             // Wide enough for AR glasses etc
    };

    // Get hat height for padding calculation
    function getHatHeight(hat) {
      if (hat === 'none' || hat === 'hoodie') return 0;
      if (accessoriesAbove[hat]) return accessoriesAbove[hat].length;
      return 0;
    }

    // Get shoes below height (for skateboard etc)
    function getShoesBelow(shoes) {
      // Currently only skateboard (in BLE77) adds line below
      return 0; // Regular shoes replace the feet line, don't add below
    }

    // Get random color from palette
    function getRandomColor() {
      return randomColors[Math.floor(Math.random() * randomColors.length)];
    }

    // Store current random colors for consistency during render
    let currentAccessoryColor = null;
    let currentStarColor = null;

    let term = null;

    function createTerminal() {
      const bodyColor = document.getElementById('bodyColor').value;

      if (term) {
        term.dispose();
      }

      term = new Terminal({
        cols: 40,
        rows: 9,
        theme: {
          background: '#0a0a0f',
          foreground: bodyColor,
          cursor: '#0a0a0f'
        },
        fontFamily: '"Cascadia Code", Consolas, monospace',
        fontSize: 24,
        lineHeight: 1.0,
        cursorBlink: false
      });

      document.getElementById('terminal').innerHTML = '';
      term.open(document.getElementById('terminal'));
      renderAscii();
    }

    function renderAscii() {
      if (!term) return;

      let starStyle = document.getElementById('starStyle').value;
      const bodyColor = document.getElementById('bodyColor').value;
      const starColor = document.getElementById('starColor').value;
      const hat = document.getElementById('hat').value;
      const hatColor = document.getElementById('hatColor').value;
      const hand = document.getElementById('hand').value;
      const handColor = document.getElementById('handColor').value;
      const shoes = document.getElementById('shoes').value;
      const shoeColor = document.getElementById('shoeColor').value;

      // 1/1 combo: adult hand forces 18+ stars
      if (hand === 'adult') {
        starStyle = 'adult';
      }

      // Helper to create ANSI color code from hex
      function ansi(hex) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return `\x1b[38;2;${r};${g};${b}m`;
      }

      const bodyAnsi = ansi(bodyColor);
      const starAnsi = ansi(starColor);  // Use selected star color from dropdown
      const goldAnsi = ansi('#ffd700');  // Bitcoin stars override to gold
      const tealAnsi = ansi('#00d4aa');  // Diamond stars override to teal

      currentAccessoryColor = hatColor;
      currentStarColor = starColor;
      const accessoryAnsi = ansi(hatColor);
      const handAnsi = ansi(handColor);
      const shoesAnsi = ansi(shoeColor);

      // Update terminal theme (base color)
      term.options.theme = {
        ...term.options.theme,
        foreground: '#ffffff'
      };

      // Clear and re-render
      term.clear();

      let ascii = [...baseAscii];

      // Check if we have a hand accessory for line 1
      const hasHandAccessory = hand !== 'none' && handAccessories[hand];

      // ===========================================
      // SIMPLE FIXED CANVAS: Body ALWAYS starts at row 4
      // Row 0: empty
      // Row 1-3: hat area (padding + hat)
      // Row 4-6: body (FIXED POSITION)
      // Row 7: shoes below (if any)
      // ===========================================

      // Devil full 1/1 - entire body is blood red with symbols
      if (hat === 'devil-full') {
        term.writeln('');  // Row 0
        term.writeln('');  // Row 1
        term.writeln('');  // Row 2
        const redAnsi = ansi('#cc0000');
        devilFullAscii.forEach(line => {
          term.writeln(redAnsi + line);
        });
        return;
      }

      // BLE77 1/1 - Mickey ears + 77 + AR glasses + skateboard
      if (hat === 'ble77') {
        term.writeln('');  // Row 0
        term.writeln('');  // Row 1
        term.writeln('');  // Row 2
        const cyanAnsi = ansi('#00d4aa');
        ble77Ascii.forEach(line => {
          term.writeln(cyanAnsi + line);
        });
        return;
      }

      // Calculate hat height and padding
      const hatHeight = getHatHeight(hat);
      const paddingNeeded = CANVAS.maxHatHeight - hatHeight;

      // Row 0: always empty
      term.writeln('');

      // Add padding BEFORE hat to keep body at fixed row
      for (let i = 0; i < paddingNeeded; i++) {
        term.writeln('');
      }

      // Render hat (if any)
      if (hat === 'hoodie') {
        ascii = [...hoodieAscii];
      } else if (hat !== 'none' && accessoriesAbove[hat]) {
        const hatAnsi = hat === 'devil' ? ansi('#cc0000') : accessoryAnsi;
        accessoriesAbove[hat].forEach(line => {
          term.writeln(hatAnsi + line);
        });
      }

      // Replace feet line with shoes
      if (shoes !== 'none' && shoesAscii[shoes]) {
        ascii[ascii.length - 1] = shoesAscii[shoes];
      }

      // Shoe-specific characters to color with shoes rarity
      const shoeChars = {
        slides: ['═'],
        crocs: ['⊏', '⊐'],
        heels: ['▚', '▞'],
        jordans: ['▄', '█'],
        dress: ['◤', '◥']
      };
      const currentShoeChars = shoeChars[shoes] || [];
      const isLastLine = (lineIndex, totalLines) => lineIndex === totalLines - 1;

      ascii.forEach((line, lineIndex) => {
        let coloredLine = '';
        let starCount = 0;
        const totalStars = (line.match(/\*/g) || []).length;
        const isFeetLine = lineIndex === ascii.length - 1;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '*') {
            starCount++;
            // If this is the last star on line 1 and we have a hand accessory, replace it
            if (lineIndex === 1 && starCount === totalStars && hasHandAccessory) {
              coloredLine += handAnsi + handAccessories[hand];
            } else {
              // Handle star styling
              if (starStyle === 'none') {
                coloredLine += ' ';
              } else if (starStyle === 'swords') {
                coloredLine += starAnsi + '⚔';
              } else if (starStyle === 'unholy') {
                coloredLine += starAnsi + '⸸';
              } else if (starStyle === 'goth') {
                const gothSymbols = ['☠', '🕷', '🕸'];
                const symbol = gothSymbols[Math.floor(Math.random() * gothSymbols.length)];
                coloredLine += starAnsi + symbol;
              } else if (starStyle === 'diamonds') {
                coloredLine += tealAnsi + '◆';
              } else if (starStyle === 'music') {
                const musicSymbols = ['𝄞', '♪', '♫'];
                const symbol = musicSymbols[Math.floor(Math.random() * musicSymbols.length)];
                coloredLine += starAnsi + symbol;
              } else if (starStyle === 'adult') {
                coloredLine += starAnsi + '18₊';
              } else if (starStyle === 'bitcoin') {
                coloredLine += goldAnsi + '₿';
              } else {
                // Default bright stars
                coloredLine += starAnsi + '*';
              }
            }
          } else if (char === ' ') {
            coloredLine += char;
          } else if (isFeetLine && currentShoeChars.includes(char)) {
            // Shoe characters get shoes color, white jordans get red tips
            if (shoes === 'jordans' && char === '▄' && shoeColor === '#ffffff') {
              coloredLine += ansi('#ef4444') + char;  // Red tips only on white jordans
            } else {
              coloredLine += shoesAnsi + char;
            }
          } else {
            // Body characters get body color
            coloredLine += bodyAnsi + char;
          }
        }
        term.writeln(coloredLine);
      });

    }

    // ===========================================
    // RARITY CALCULATION (matches server/traits.js)
    // ===========================================

    function calculateRarity() {
      const bodyColor = document.getElementById('bodyColor').value;
      const starStyle = document.getElementById('starStyle').value;
      const hat = document.getElementById('hat').value;
      const hand = document.getElementById('hand').value;
      const shoes = document.getElementById('shoes').value;

      let score = 0;

      // Body color scoring
      const bodyScores = {
        '#8b5cf6': 0, '#ec4899': 0, '#22c55e': 0, '#ffffff': 0,  // Common
        '#f97316': 2, '#3b82f6': 2, '#ef4444': 2, '#b0b0c0': 2,  // Uncommon
        '#eab308': 4,  // Gold (Rare)
        '#00d4aa': 5,  // Diamond (Rare)
      };
      score += bodyScores[bodyColor] || 0;

      // Star style scoring
      const starScores = {
        bright: 0, swords: 0, music: 0, none: 0,  // Common
        unholy: 2, goth: 2,  // Uncommon
        bitcoin: 5, diamonds: 6,  // Rare
      };
      score += starScores[starStyle] || 0;

      // Hat scoring
      const hatScores = {
        none: 0, cap: 1, tophat: 1,  // Common
        wizardhat: 2, devil: 3,  // Uncommon
        halo: 5, crown: 5, hoodie: 4,  // Rare
        'devil-full': 15,  // 1/1
        'ble77': 15,  // 1/1
      };
      score += hatScores[hat] || 0;

      // Hand scoring
      const handScores = {
        none: 0, peace: 0, pen: 0, microphone: 0,  // Common
        coffee: 1, phone: 2,  // Uncommon
        rolex: 4,  // Rare
        adult: 15,  // 1/1
      };
      score += handScores[hand] || 0;

      // Shoes scoring
      const shoesScores = {
        none: 0, slides: 1, crocs: 1,  // Common
        heels: 2, dress: 2,  // Uncommon
        jordans: 4,  // Rare
      };
      score += shoesScores[shoes] || 0;

      // Determine rarity tier (colors match body color rarity system)
      if (score >= 30) return { tier: 'legendary', color: '#00d4aa', emoji: '💎' };  // Diamond
      if (score >= 20) return { tier: 'epic', color: '#eab308', emoji: '🌟' };       // Gold
      if (score >= 12) return { tier: 'rare', color: '#eab308', emoji: '✨' };       // Gold
      if (score >= 6) return { tier: 'uncommon', color: '#b0b0c0', emoji: '🔘' };   // Silver
      return { tier: 'common', color: '#ffffff', emoji: '⚪' };                      // White
    }

    // Rarity colors for traits (matches body color rarity)
    const RARITY_COLORS = {
      common: '#ffffff',    // White (Common)
      uncommon: '#b0b0c0',  // Silver (Uncommon)
      rare: '#eab308',      // Gold (Rare)
      oneOfOne: '#00d4aa'   // Diamond/Teal (1/1)
    };

    // Get rarity tier for individual trait value
    function getTraitRarity(traitType, value) {
      const rarityMap = {
        bodyColor: {
          '#8b5cf6': 'common', '#ec4899': 'common', '#22c55e': 'common', '#ffffff': 'common',
          '#f97316': 'uncommon', '#3b82f6': 'uncommon', '#ef4444': 'uncommon', '#b0b0c0': 'uncommon',
          '#eab308': 'rare', '#00d4aa': 'rare'
        },
        starStyle: {
          bright: 'common', swords: 'common', music: 'common', none: 'common',
          unholy: 'uncommon', goth: 'uncommon',
          bitcoin: 'rare', diamonds: 'rare'
        },
        hat: {
          none: 'common', cap: 'common', tophat: 'common',
          wizardhat: 'uncommon', devil: 'uncommon',
          halo: 'rare', crown: 'rare', hoodie: 'rare',
          'devil-full': 'oneOfOne',
          'ble77': 'oneOfOne'
        },
        hand: {
          none: 'common', peace: 'common', pen: 'common', microphone: 'common',
          coffee: 'uncommon', phone: 'uncommon',
          rolex: 'rare',
          adult: 'oneOfOne'
        },
        shoes: {
          none: 'common', slides: 'common', crocs: 'common',
          heels: 'uncommon', dress: 'uncommon',
          jordans: 'rare'
        }
      };
      return rarityMap[traitType]?.[value] || 'common';
    }

    function updateTraitList() {
      const bodyColor = document.getElementById('bodyColor').value;
      const starStyle = document.getElementById('starStyle').value;
      const starColor = document.getElementById('starColor').value;
      const hat = document.getElementById('hat').value;
      const hatColor = document.getElementById('hatColor').value;
      const hand = document.getElementById('hand').value;
      const handColor = document.getElementById('handColor').value;
      const shoes = document.getElementById('shoes').value;
      const shoeColor = document.getElementById('shoeColor').value;

      const traits = [
        { key: 'Body', value: document.getElementById('bodyColor').options[document.getElementById('bodyColor').selectedIndex].text, type: 'bodyColor', rawValue: bodyColor },
        { key: 'Star Style', value: document.getElementById('starStyle').options[document.getElementById('starStyle').selectedIndex].text, type: 'starStyle', rawValue: starStyle },
        { key: 'Star Color', value: document.getElementById('starColor').options[document.getElementById('starColor').selectedIndex].text, type: 'bodyColor', rawValue: starColor },
        { key: 'Hat', value: document.getElementById('hat').options[document.getElementById('hat').selectedIndex].text, type: 'hat', rawValue: hat },
        { key: 'Hat Color', value: document.getElementById('hatColor').options[document.getElementById('hatColor').selectedIndex].text, type: 'bodyColor', rawValue: hatColor },
        { key: 'Hand', value: document.getElementById('hand').options[document.getElementById('hand').selectedIndex].text, type: 'hand', rawValue: hand },
        { key: 'Hand Color', value: document.getElementById('handColor').options[document.getElementById('handColor').selectedIndex].text, type: 'bodyColor', rawValue: handColor },
        { key: 'Shoes', value: document.getElementById('shoes').options[document.getElementById('shoes').selectedIndex].text, type: 'shoes', rawValue: shoes },
        { key: 'Shoe Color', value: document.getElementById('shoeColor').options[document.getElementById('shoeColor').selectedIndex].text, type: 'bodyColor', rawValue: shoeColor }
      ];

      const traitList = document.getElementById('traitList');
      traitList.innerHTML = traits.map(trait => {
        const rarity = getTraitRarity(trait.type, trait.rawValue);
        const color = RARITY_COLORS[rarity];
        return `<div class="trait-badge" style="border-color: ${color};"><span style="color: ${color};">${trait.key}:</span> ${trait.value}</div>`;
      }).join('');

      // Update rarity display
      const rarity = calculateRarity();
      const rarityDisplay = document.getElementById('rarityDisplay');
      rarityDisplay.textContent = `${rarity.emoji} ${rarity.tier.toUpperCase()} ${rarity.emoji}`;
      rarityDisplay.style.background = rarity.color;
      rarityDisplay.style.color = rarity.tier === 'legendary' ? '#0a0a0f' : '#fff';
    }

    function updateAsciiOutput() {
      let starStyle = document.getElementById('starStyle').value;
      const hat = document.getElementById('hat').value;
      const hand = document.getElementById('hand').value;
      const shoes = document.getElementById('shoes').value;

      // 1/1 combo: adult hand forces 18+ stars
      if (hand === 'adult') {
        starStyle = 'adult';
      }

      // Devil full 1/1 - special output
      if (hat === 'devil-full') {
        const output = ['"⛧ DEVIL FULL 1/1 ⛧"', ''].concat(devilFullAscii);
        document.getElementById('asciiOutput').value = output.join('\n');
        return;
      }

      // BLE77 1/1 - special output (owner mintable only)
      if (hat === 'ble77') {
        const output = ['"🛹 BLE77 1/1 🛹"', ''].concat(ble77Ascii);
        document.getElementById('asciiOutput').value = output.join('\n');
        return;
      }

      // Use hoodie body if selected
      let ascii = hat === 'hoodie' ? [...hoodieAscii] : [...baseAscii];

      // Replace feet with shoes
      if (shoes !== 'none' && shoesAscii[shoes]) {
        ascii[ascii.length - 1] = shoesAscii[shoes];
      }

      // Add hand accessory - replaces the right star on middle line (not for hoodie)
      if (hand !== 'none' && handAccessories[hand] && hat !== 'hoodie') {
        ascii[1] = ascii[1].replace(/ \*$/, handAccessories[hand]);
      }

      // Replace stars
      ascii = ascii.map(line => {
        if (starStyle === 'none') {
          return line.replace(/\*/g, ' ');
        } else if (starStyle === 'swords') {
          return line.replace(/\*/g, '⚔');
        } else if (starStyle === 'unholy') {
          return line.replace(/\*/g, '⸸');
        } else if (starStyle === 'goth') {
          const gothSymbols = ['☠', '🕷', '🕸'];
          return line.replace(/\*/g, () => gothSymbols[Math.floor(Math.random() * gothSymbols.length)]);
        } else if (starStyle === 'diamonds') {
          return line.replace(/\*/g, '◆');
        } else if (starStyle === 'music') {
          const musicSymbols = ['𝄞', '♪', '♫'];
          return line.replace(/\*/g, () => musicSymbols[Math.floor(Math.random() * musicSymbols.length)]);
        } else if (starStyle === 'adult') {
          return line.replace(/\*/g, '18₊');
        } else if (starStyle === 'bitcoin') {
          return line.replace(/\*/g, '₿');
        }
        return line;
      });

      // Add hat above (skip for hoodie since it has its own hood)
      let output = hat === 'devil' ? ['"😈 Devil Clawd!"', ''] : ['"This is my cute Clawd!"', ''];
      if (hat !== 'none' && hat !== 'hoodie' && accessoriesAbove[hat]) {
        output = output.concat(accessoriesAbove[hat]);
      }
      output = output.concat(ascii);

      document.getElementById('asciiOutput').value = output.join('\n');
    }

    function handleChange() {
      createTerminal();
      updateTraitList();
      updateAsciiOutput();
    }

    // Event listeners
    document.querySelectorAll('select').forEach(el => {
      el.addEventListener('change', handleChange);
    });

    // Copy button
    document.getElementById('copyBtn').addEventListener('click', function() {
      const textarea = document.getElementById('asciiOutput');
      textarea.select();
      document.execCommand('copy');
      this.textContent = 'Copied!';
      setTimeout(() => { this.textContent = 'Copy to Clipboard'; }, 1500);
    });

    // ===========================================
    // RARITY-BASED RANDOMIZER
    // ===========================================

    // Weighted random selection helper
    function weightedRandom(options) {
      const total = options.reduce((sum, opt) => sum + opt.weight, 0);
      let rand = Math.random() * total;
      for (const opt of options) {
        rand -= opt.weight;
        if (rand <= 0) return opt.value;
      }
      return options[options.length - 1].value;
    }

    // Body Color weights - Common ~40%, Uncommon ~50%, Rare ~10%
    const bodyColorWeights = [
      { value: '#8b5cf6', weight: 12 },  // Purple (Common)
      { value: '#ec4899', weight: 12 },  // Pink (Common)
      { value: '#22c55e', weight: 12 },  // Green (Common)
      { value: '#ffffff', weight: 10 },  // White (Common)
      { value: '#f97316', weight: 14 },  // Orange (Uncommon)
      { value: '#3b82f6', weight: 14 },  // Blue (Uncommon)
      { value: '#ef4444', weight: 14 },  // Red (Uncommon)
      { value: '#b0b0c0', weight: 8 },   // Silver (Uncommon)
      { value: '#eab308', weight: 2.5 }, // Gold (Rare)
      { value: '#00d4aa', weight: 1.5 }, // Diamond (Rare)
    ];

    // Star Style weights - Common ~80%, Uncommon ~15%, Rare ~5%
    const starStyleWeights = [
      { value: 'bright', weight: 26 },   // Common
      { value: 'swords', weight: 20 },   // Common
      { value: 'music', weight: 18 },    // Common
      { value: 'none', weight: 16 },     // Common
      { value: 'unholy', weight: 8 },    // Uncommon ~8%
      { value: 'goth', weight: 7 },      // Uncommon ~7%
      { value: 'bitcoin', weight: 3 },   // Rare ~3%
      { value: 'diamonds', weight: 2 },  // Rare ~2%
    ];

    // Hat weights - Common ~55%, Uncommon ~30%, Rare ~14%, 1/1 ~1% (split between 2)
    const hatWeights = [
      { value: 'none', weight: 30 },       // Common
      { value: 'cap', weight: 22 },        // Common
      { value: 'tophat', weight: 20 },     // Common
      { value: 'wizardhat', weight: 10 },  // Uncommon
      { value: 'devil', weight: 8 },       // Uncommon
      { value: 'halo', weight: 5 },        // Rare
      { value: 'hoodie', weight: 5 },      // Rare
      { value: 'crown', weight: 4 },       // Rare
      { value: 'devil-full', weight: 0.5 },// 1/1 (0.5%)
      { value: 'ble77', weight: 0.5 },     // 1/1 (0.5%)
    ];

    // Hand weights - Common ~76%, Uncommon ~18%, Rare ~5%, 1/1 ~0.5%
    const handWeights = [
      { value: 'none', weight: 28 },       // Common
      { value: 'peace', weight: 18 },      // Common
      { value: 'pen', weight: 16 },        // Common
      { value: 'microphone', weight: 14 }, // Common
      { value: 'coffee', weight: 10 },     // Uncommon
      { value: 'phone', weight: 8 },       // Uncommon
      { value: 'rolex', weight: 5 },       // Rare ~5%
      { value: 'adult', weight: 0.5 },     // 1/1 (0.5%)
    ];

    // Shoes weights - Common ~68%, Uncommon ~22%, Rare ~10%
    const shoesWeights = [
      { value: 'none', weight: 26 },    // Barefoot (Common)
      { value: 'slides', weight: 22 },  // Slides (Common)
      { value: 'crocs', weight: 20 },   // Crocs (Common)
      { value: 'heels', weight: 12 },   // High Heels (Uncommon)
      { value: 'dress', weight: 10 },   // Dress Shoes (Uncommon)
      { value: 'jordans', weight: 10 }, // Jordans (Rare) ~10%
    ];

    function randomizeAll() {
      // Randomize each trait based on weights
      document.getElementById('bodyColor').value = weightedRandom(bodyColorWeights);
      document.getElementById('starStyle').value = weightedRandom(starStyleWeights);
      document.getElementById('starColor').value = weightedRandom(bodyColorWeights);  // Same rarity as body colors
      document.getElementById('hat').value = weightedRandom(hatWeights);
      document.getElementById('hatColor').value = weightedRandom(bodyColorWeights);   // Same rarity as body colors
      document.getElementById('hand').value = weightedRandom(handWeights);
      document.getElementById('handColor').value = weightedRandom(bodyColorWeights);  // Same rarity as body colors
      document.getElementById('shoes').value = weightedRandom(shoesWeights);
      document.getElementById('shoeColor').value = weightedRandom(bodyColorWeights);  // Same rarity as body colors

      // Re-render
      handleChange();
    }

    // Randomize button
    document.getElementById('randomizeBtn').addEventListener('click', randomizeAll);

    // Initial render
    createTerminal();
    updateTraitList();
    updateAsciiOutput();
  </script>
