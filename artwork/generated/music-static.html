<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512, height=512">
  <title>Clawd NFT</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 512px;
      height: 512px;
      overflow: hidden;
    }

    body {
      background: #000000;
      font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clawd-art {
      font-size: 52px;
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 0 20px #ec489940;
    }

    .body { color: #ec4899; }
    .stars { color: #ec4899; }
    .hat { color: #ec4899; font-size: 44px; }
    .shoes { color: #ec4899; font-size: 40px; }

    .terminal-prompt {
      margin-top: 40px;
      width: 320px;
    }

    .terminal-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, #2a3a4a, #3a4a5a, #2a3a4a, transparent);
    }

    .prompt-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      font-size: 18px;
    }

    .prompt-arrow {
      color: #4a5a6a;
      margin-right: 8px;
    }

    .cursor {
      width: 10px;
      height: 18px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="clawd-art">
    <div class="hat">◖ ◗</div>
    <div>
      <span class="stars">♪</span>
      <span class="body">▐▛███▜▌</span>
      <span class="stars">♪</span>
    </div>
    <div>
      <span class="stars">♪</span>
      <span class="body">▝▜█████▛▘</span>
      <span class="stars">♪</span>
    </div>
    <div>
      <span class="stars">♪</span>
      <span class="shoes">⊏▘ ▝⊐</span>
      <span class="stars">♪</span>
    </div>

    <div class="terminal-prompt">
      <div class="terminal-line"></div>
      <div class="prompt-row">
        <span class="prompt-arrow">></span>
        <div class="cursor"></div>
      </div>
      <div class="terminal-line"></div>
    </div>
  </div>
</body>
</html>
