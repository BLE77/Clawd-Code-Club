<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512, height=512">
  <title>Clawd #8111</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@5.0.3/index.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #0d1117;
    }

    .terminal-wrapper {
      width: 512px;
      height: 512px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .terminal-header {
      height: 32px;
      background: #1a1a25;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      border-bottom: 1px solid #2a2a3a;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27ca40; }

    .terminal-title {
      color: #606070;
      font-size: 12px;
      margin-left: 8px;
    }

    .terminal-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .clawd-art {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    #terminal {
      width: 480px;
      height: 200px;
      overflow: hidden;
    }

    /* Hide xterm scrollbar */
    .xterm-viewport::-webkit-scrollbar {
      display: none;
    }
    .xterm-viewport {
      scrollbar-width: none;
      overflow: hidden !important;
    }

    .terminal-prompt {
      margin-top: 20px;
      width: 320px;
    }

    .terminal-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, #2a3a4a, #3a4a5a, #2a3a4a, transparent);
    }

    .prompt-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      font-size: 18px;
      font-family: "Cascadia Code", Consolas, monospace;
    }

    .prompt-arrow {
      color: #4a5a6a;
      margin-right: 8px;
    }

    .cursor {
      width: 10px;
      height: 18px;
      background: #ffffff;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .info-bar {
      height: 40px;
      background: #1a1a25;
      border-top: 1px solid #2a2a3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      font-family: "Cascadia Code", Consolas, monospace;
    }

    .nft-name { color: #00d4aa; }
    .nft-rarity {
      color: #0a0a0f;
      background: linear-gradient(90deg, #00d4aa, #00d4aacc);
      padding: 4px 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="terminal-wrapper">
    <div class="terminal-header">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <span class="terminal-title">clawd_#8111.exe</span>
    </div>

    <div class="terminal-body">
      <div class="clawd-art">
        <div id="terminal"></div>
      </div>

      <div class="terminal-prompt">
        <div class="terminal-line"></div>
        <div class="prompt-row">
          <span class="prompt-arrow">></span>
          <div class="cursor"></div>
        </div>
        <div class="terminal-line"></div>
      </div>
    </div>

    <div class="info-bar">
      <span class="nft-name">CLAWD #8111</span>
      <span class="nft-rarity">EPIC</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script>
    // EXACT same terminal config as static
    const term = new Terminal({
      cols: 32,
      rows: 7,
      theme: {
        background: '#0d1117',
        foreground: '#ffffff',
        cursor: '#0d1117'
      },
      fontFamily: '"Cascadia Code", Consolas, monospace',
      fontSize: 28,
      lineHeight: 1.0,
      cursorBlink: false
    });

    term.open(document.getElementById('terminal'));

    // ANSI color helpers
    function ansi(r, g, b) {
      return '\x1b[38;2;' + r + ';' + g + ';' + b + 'm';
    }
    const reset = '\x1b[0m';

    // Colors - EXACT same as static
    const bodyAnsi = ansi(0, 212, 170);
    const starAnsi = ansi(0, 212, 170);
    const hatAnsi = ansi(234, 179, 8);
    const shoeAnsi = ansi(0, 212, 170);
    const handAnsi = ansi(0, 212, 170);

    // Hat
    const hatChar = '♛';
    // Star character
    const starChar = '◆';
    // Hand character (replaces right star on line 2)
    const handChar = '⏱';
    // Feet characters
    const feetChars = '▄█ █▄';

    // Render - centered (added padding)
    term.writeln('');

    // Hat line (if any)
    if (hatChar) {
      term.writeln('              ' + hatAnsi + hatChar + reset);
    } else {
      term.writeln('');
    }

    // Body line 1: star body star (top line)
    term.writeln('           ' + starAnsi + starChar + reset + ' ' + bodyAnsi + '\u2590\u259B\u2588\u2588\u2588\u259C\u258C' + reset + ' ' + starAnsi + starChar + reset);

    // Body line 2: star body (hand or star)
    const rightChar2 = handChar ? (handAnsi + handChar) : (starAnsi + starChar);
    term.writeln('          ' + starAnsi + starChar + reset + ' ' + bodyAnsi + '\u259D\u259C\u2588\u2588\u2588\u2588\u2588\u259B\u2598' + reset + ' ' + rightChar2 + reset);

    // Body line 3: star feet star
    term.writeln('           ' + starAnsi + starChar + reset + '  ' + shoeAnsi + feetChars + reset + '  ' + starAnsi + starChar + reset);
  </script>
</body>
</html>
