<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512, height=512">
  <title>Clawd NFT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@5.0.3/index.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #0d1117;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #terminal {
      width: 480px;
      height: 200px;
      overflow: hidden;
    }

    /* Hide xterm scrollbar */
    .xterm-viewport::-webkit-scrollbar {
      display: none;
    }
    .xterm-viewport {
      scrollbar-width: none;
      overflow: hidden !important;
    }

    .terminal-prompt {
      margin-top: 30px;
      width: 320px;
    }

    .terminal-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, #2a3a4a, #3a4a5a, #2a3a4a, transparent);
    }

    .prompt-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      font-size: 18px;
      font-family: "Cascadia Code", Consolas, monospace;
    }

    .prompt-arrow {
      color: #4a5a6a;
      margin-right: 8px;
    }

    .cursor {
      width: 10px;
      height: 18px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <div class="terminal-prompt">
    <div class="terminal-line"></div>
    <div class="prompt-row">
      <span class="prompt-arrow">></span>
      <div class="cursor"></div>
    </div>
    <div class="terminal-line"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script>
    const term = new Terminal({
      cols: 32,
      rows: 7,
      theme: {
        background: '#0d1117',
        foreground: '#ffffff',
        cursor: '#0d1117'
      },
      fontFamily: '"Cascadia Code", Consolas, monospace',
      fontSize: 28,
      lineHeight: 1.0,
      cursorBlink: false
    });

    term.open(document.getElementById('terminal'));

    // ANSI color helpers
    function ansi(r, g, b) {
      return '\x1b[38;2;' + r + ';' + g + ';' + b + 'm';
    }
    const reset = '\x1b[0m';

    // Colors
    const bodyAnsi = ansi(236, 72, 153);
    const starAnsi = ansi(236, 72, 153);
    const hatAnsi = ansi(255, 255, 255);
    const shoeAnsi = ansi(255, 255, 255);
    const handAnsi = ansi(0, 212, 170);

    // Hat
    const hatChar = '┌──╮';
    // Star character
    const starChar = '⚔';
    // Hand character (replaces right star on line 1 if present)
    const handChar = '✌︎';
    // Feet characters
    const feetChars = '▄█ █▄';

    // Render - centered (added padding)
    term.writeln('');

    // Hat line (if any)
    if (hatChar) {
      term.writeln('            ' + hatAnsi + hatChar + reset);
    } else {
      term.writeln('');
    }

    // Body line 1: star body star (top line)
    term.writeln('         ' + starAnsi + starChar + reset + ' ' + bodyAnsi + '\u2590\u259B\u2588\u2588\u2588\u259C\u258C' + reset + ' ' + starAnsi + starChar + reset);

    // Body line 2: star body (hand or star)
    const rightChar2 = handChar ? (handAnsi + handChar) : (starAnsi + starChar);
    term.writeln('        ' + starAnsi + starChar + reset + ' ' + bodyAnsi + '\u259D\u259C\u2588\u2588\u2588\u2588\u2588\u259B\u2598' + reset + ' ' + rightChar2 + reset);

    // Body line 3: star feet star
    term.writeln('         ' + starAnsi + starChar + reset + '  ' + shoeAnsi + feetChars + reset + '  ' + starAnsi + starChar + reset);
  </script>
</body>
</html>
